name: ML Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  integration_and_build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup Python Env
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Tests
      run: |
        pytest tests/
        
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/pet-classifier-app:latest

  deployment_tests:
    needs: integration_and_build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Start Docker Compose
      run: |
        sed -i 's|build: .|image: ghcr.io/${{ github.repository_owner }}/pet-classifier-app:latest|g' docker-compose.yml
        docker compose pull
        docker compose up -d
        
    - name: Wait for API to be ready
      run: |
        echo "Waiting for Flask server..."
        for i in {1..15}; do
          curl -f http://localhost:5000/ping && echo "API is ready!" && break
          echo "Waiting..."
          sleep 4
        done
        docker compose ps
        docker compose logs
        curl -f http://localhost:5000/ping || exit 1
        
    - name: Smoke Test Model Inference
      run: |
        curl -o dog.jpg https://upload.wikimedia.org/wikipedia/commons/4/47/American_Eskimo_Dog.jpg
        RESPONSE=$(curl -X POST -F "file=@dog.jpg" http://localhost:5000/predict)
        echo "Inference Response: $RESPONSE"
        if [[ $RESPONSE != *"predicted_class"* ]]; then
          echo "Smoke test failed: expected JSON keys missing"
          exit 1
        fi
        
    - name: Cleanup
      if: always()
      run: docker compose down
